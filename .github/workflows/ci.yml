name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ffmpeg/ffprobe are runtime dependencies of downloader.py, get_duration_impl.py and
      # the ffmpeg export backend. The audio-probing tests need them too.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installed from requirements files rather than pyproject: its [project].dependencies
          # are inaccurate (see enhancements-plan.md, Phase A1).
          pip install -r requirements.txt -r requirements-mcp.txt
          pip install pytest flake8

      # Strict on the code we own and keep clean. A finding here fails the build.
      - name: Lint (export modules and tests)
        run: flake8 export_impl.py export_task_cache.py export_backends/ tests/

      # Advisory: the pre-existing modules carry ~836 findings. Reported so the debt stays
      # visible, non-blocking so CI is not red from day one. Burn-down tracked in
      # enhancements-plan.md, Phase C5.
      - name: Lint (whole repo, advisory)
        continue-on-error: true
        run: flake8 .

      - name: Test
        run: pytest -v
